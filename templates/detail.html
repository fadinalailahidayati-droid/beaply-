<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Detail Beasiswa</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-light bg-white shadow">

<div class="container">

<a class="navbar-brand fw-bold text-primary"
href="/">

🎓 Beaply

</a>

<a
href="/login"
class="btn btn-warning">

Login

</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<h2 class="fw-bold">

{{ data.NAMA_BEASISWA }}

</h2>

<hr>

<p>

<b>Penyelenggara :</b>

{{ data.PENYELENGGARA }}

</p>

<p>

<b>Kuota :</b>

{{ data.KUOTA }}

</p>

<p>

<b>Deadline :</b>

{{ data.DEADLINE }}

</p>

<p>

<b>Deskripsi :</b>

</p>

<p>

{{ data.DESKRIPSI }}

</p>

<div class="mt-4">

<a href="/pendaftaran/tambah/{{ data.ID }}" class="btn btn-warning">
    Daftar Sekarang
</a>

<a
href="/"
class="btn btn-secondary">

Kembali

</a>

</div>

</div>

</div>

</div>

</body>

</html>
